[common]

# ↓↓↓ dashboard_* 由 FRP Manager 自动转换：ini 格式下 [webServer] 段不被 frp 识别
dashboard_port = 7500
dashboard_addr = 0.0.0.0
dashboard_user = admin
dashboard_pwd = admin
# ↑↑↑ 修改后需重启 frps 生效
bind_port = 7000
bind_addr = 0.0.0.0
token = 
# ===== 安全相关设置 =====
authentication_method = token
auth_token_timeout = 900
max_pool_count = 5
allow_ports = 2000-3000,3001,3003,4000-50000
# tls_only = true  # 仅允许 TLS（需客户端同步开启）
log_file = ./logs/frps.log
log_level = info
log_max_days = 3
