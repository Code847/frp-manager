# FRP Manager · Web 控制台登录认证配置
#
# 修改后无需重启进程；改动密码会让所有已登录会话立即失效。

[auth]
# 是否启用登录保护。false = 任何人都能直接打开面板
enabled = true

# 登录账号
username = admin

# 登录密码（明文即可；也可填 werkzeug generate_password_hash 生成的 pbkdf2 串）
password = admin

# 图形验证码开关：true = 登录时必须额外填写右侧图片里的 4 位字符
captcha = true

# 会话有效期（分钟）。0 = 不勾选「记住此设备」时，关闭浏览器立刻失效
session_minutes = 0

# 勾选「记住此设备」后保留的天数
remember_days = 7
